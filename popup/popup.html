<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400" />
    <title>DevClip</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="w-[400px] h-[500px] bg-gray-50 text-gray-900 overflow-hidden">
    <div id="app" class="flex flex-col h-full">
      <!-- 헤더 -->
      <header
        class="flex items-center justify-between px-4 py-3 bg-white border-b border-gray-200 shrink-0"
      >
        <div class="flex items-center gap-2">
          <span class="text-lg">🌐</span>
          <h1 class="text-base font-bold text-gray-900">DevClip</h1>
          <span
            id="snippet-count"
            class="text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full font-medium"
            >0</span
          >
        </div>
        <div class="flex items-center gap-1">
          <!-- 가져오기 버튼 -->
          <button
            id="btn-import"
            title="JSON 가져오기"
            class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
              />
            </svg>
          </button>
          <input type="file" id="import-file" accept=".json" class="hidden" />
          <!-- 내보내기 버튼 -->
          <button
            id="btn-export"
            title="JSON 내보내기"
            class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </button>
          <!-- 전체 삭제 버튼 -->
          <button
            id="btn-clear"
            title="전체 삭제"
            class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- 검색바 -->
      <div class="px-4 py-2 bg-white border-b border-gray-100 shrink-0">
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            id="search-input"
            type="text"
            placeholder="코드, 태그, 언어로 검색... (Ctrl+F)"
            class="w-full pl-9 pr-8 py-2 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400"
          />
          <!-- 검색어 초기화 버튼 -->
          <button
            id="search-clear"
            title="검색어 지우기"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-gray-300 text-white flex items-center justify-center text-xs leading-none hover:bg-gray-400 transition-colors hidden"
          >
            &times;
          </button>
        </div>
        <!-- 검색 결과 카운트 -->
        <div id="search-status" class="hidden mt-1.5">
          <span class="text-xs text-gray-400" id="search-status-text"></span>
        </div>
      </div>

      <!-- 태그 필터 영역 -->
      <div
        id="tag-filter-area"
        class="px-4 py-2 bg-white border-b border-gray-100 shrink-0 hidden"
      >
        <div id="tag-list" class="flex flex-wrap gap-1.5">
          <!-- JS로 태그 버튼 동적 생성 -->
        </div>
      </div>

      <!-- 스니펫 목록 -->
      <div id="snippet-list" class="flex-1 overflow-y-auto">
        <!-- JS로 스니펫 카드 동적 생성 -->
      </div>

      <!-- 빈 상태 -->
      <div
        id="empty-state"
        class="flex-1 flex flex-col items-center justify-center text-center px-8 hidden"
      >
        <div class="text-4xl mb-3">📋</div>
        <p class="text-sm font-medium text-gray-500 mb-1">
          저장된 스니펫이 없습니다
        </p>
        <p class="text-xs text-gray-400 leading-relaxed">
          웹 페이지의 코드 블록 위에 마우스를 올리고<br />
          <span
            class="inline-flex items-center gap-1 bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded text-xs font-medium"
            >💾 저장</span
          >
          버튼을 클릭해 보세요
        </p>
      </div>

      <!-- 검색 결과 없음 -->
      <div
        id="no-results"
        class="flex-1 flex flex-col items-center justify-center text-center px-8 hidden"
      >
        <div class="text-4xl mb-3">🔍</div>
        <p class="text-sm font-medium text-gray-500">검색 결과가 없습니다</p>
      </div>
    </div>

    <!-- 단축키 안내 패널 -->
    <div
      id="shortcuts-panel"
      class="absolute inset-0 bg-white z-50 flex flex-col hidden"
    >
      <div
        class="flex items-center justify-between px-4 py-3 border-b border-gray-200"
      >
        <h2 class="text-sm font-bold text-gray-900">⌨️ 단축키 안내</h2>
        <button
          id="shortcuts-close"
          class="p-1 rounded hover:bg-gray-100 text-gray-400 hover:text-gray-600"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3">
        <div class="space-y-2">
          <h3
            class="text-xs font-semibold text-gray-500 uppercase tracking-wide"
          >
            팝업 내
          </h3>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">검색 포커스</span>
            <kbd
              class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200 font-mono"
              >Ctrl+F</kbd
            >
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">검색 초기화</span>
            <kbd
              class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200 font-mono"
              >Esc</kbd
            >
          </div>
        </div>
        <div class="space-y-2">
          <h3
            class="text-xs font-semibold text-gray-500 uppercase tracking-wide"
          >
            웹 페이지
          </h3>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">코드 블록 위 복사</span>
            <span class="text-xs text-gray-500">📋 복사 버튼</span>
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">코드 블록 저장</span>
            <span class="text-xs text-gray-500">💾 저장 버튼</span>
          </div>
        </div>
        <div class="space-y-2">
          <h3
            class="text-xs font-semibold text-gray-500 uppercase tracking-wide"
          >
            스니펫 관리
          </h3>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">제목 편집</span>
            <span class="text-xs text-gray-500">제목 클릭</span>
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">코드 편집</span>
            <span class="text-xs text-gray-500">코드 더블클릭</span>
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">태그 추가</span>
            <span class="text-xs text-gray-500">+ 버튼</span>
          </div>
          <div class="flex justify-between items-center py-1">
            <span class="text-sm text-gray-700">태그 삭제</span>
            <span class="text-xs text-gray-500">태그 호버 → ✗</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 푸터 -->
    <footer
      class="flex items-center justify-between px-4 py-2 bg-white border-t border-gray-100 shrink-0"
    >
      <span class="text-xs text-gray-400">DevClip v0.1.0</span>
      <div class="flex items-center gap-2">
        <button
          id="btn-export-md"
          title="Markdown으로 내보내기"
          class="text-xs text-gray-400 hover:text-gray-600 transition-colors"
        >
          MD
        </button>
        <button
          id="btn-shortcuts"
          title="단축키 안내"
          class="text-xs text-gray-400 hover:text-gray-600 transition-colors"
        >
          ⌨️
        </button>
      </div>
    </footer>

    <!-- storage.js를 popup에서도 사용 -->
    <script src="../utils/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
